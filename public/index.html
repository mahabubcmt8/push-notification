<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Push Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 4rem auto; padding: 0 1rem; }
    button { font-size: 1rem; padding: .6rem 1rem; cursor: pointer; }
    #status { margin-top: 1rem; color: #555; }
  </style>
</head>
<body>
  <h1>Web Push Demo</h1>
  <button id="toggle" disabled>Loading…</button>
  <p id="status"></p>

  <hr style="margin: 2rem 0;">

  <h2>Send a notification</h2>
  <p>
    <label style="display:block; margin-bottom:.3rem;">Title<br>
      <input id="sendTitle" type="text" value="Hi" style="width:100%; padding:.4rem;">
    </label>
    <label style="display:block; margin:.6rem 0 .3rem;">Body<br>
      <input id="sendBody" type="text" value="It works" style="width:100%; padding:.4rem;">
    </label>
  </p>
  <button id="sendBtn">Send Notification</button>
  <p id="sendStatus"></p>

  <script src="app.js"></script>
</body>
</html>
